plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id("io.qameta.allure") version "2.12.0"     // ✅ plugin stays here
    id("io.freefair.lombok") version "8.14.2"
}

group = 'com'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // JUnit
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.12.2'

    // Playwright
    implementation 'com.microsoft.playwright:playwright:1.55.0'

    // Logging
    implementation 'org.apache.logging.log4j:log4j-core:2.24.3'
    implementation 'org.apache.logging.log4j:log4j-api:2.24.3'
    implementation 'org.slf4j:slf4j-nop:2.0.16'

    // Spring Boot Test
    implementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.mockito', module: 'mockito-core'
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }

    // ✅ Allure test reporting library updated
    implementation 'io.qameta.allure:allure-junit-platform:2.30.0'
}

test {
    systemProperties = System.getProperties() as Map<String, ?>
    useJUnitPlatform()
}

bootJar {
    enabled = false
}
